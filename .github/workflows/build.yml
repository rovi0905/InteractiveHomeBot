name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract project
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Project contents:"
          find project -maxdepth 4 -type f | sort | head -300

      - name: Locate Gradle project
        id: locate
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find project -type f | sort
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          echo "Found Android project:"
          echo "$DIR"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          set -e

          cd "${{ steps.locate.outputs.dir }}"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            ls -la
            exit 1
          fi

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveHomeBot-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
