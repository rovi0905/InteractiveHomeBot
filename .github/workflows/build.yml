name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo ""
          echo "===== EXTRACTED PROJECT ====="
          find project -maxdepth 5 -type f | sort
          echo "============================="

      - name: Locate Gradle project
        id: locate
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            echo ""
            echo "Files found:"
            find project -type f | sort
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          echo ""
          echo "===== GRADLE PROJECT FOUND ====="
          echo "$DIR"
          echo "================================"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle project
        run: |
          set -e

          cd "${{ steps.locate.outputs.dir }}"

          echo "===== PROJECT DIRECTORY ====="
          pwd
          echo ""

          echo "===== PROJECT FILES ====="
          ls -la
          echo "=========================="

      - name: Build APK
        run: |
          set -e

          cd "${{ steps.locate.outputs.dir }}"

          echo "===== GRADLE VERSION ====="
          gradle --version

          echo ""
          echo "===== BUILDING APK ====="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo "===================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveHomeBot-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
