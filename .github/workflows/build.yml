name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdkmanager location:"
          command -v sdkmanager

          echo "sdkmanager version:"
          sdkmanager --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 8 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Building from:"
          pwd

          echo "Project contents:"
          ls -la

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveHomeBot-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
