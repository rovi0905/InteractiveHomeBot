name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q InteractiveHomeBot_GitHub_Build.zip -d project

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveHomeBot-APK
          path: "**/build/outputs/apk/**/*.apk"
