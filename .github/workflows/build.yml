name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 5 -type f | sort | head -300

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching extracted files:"
            find android-project -type f | sort | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project directory:"
          pwd

          echo "Project contents:"
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveHomeBot-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
  - name: Build Debug APK
    shell: bash
    run: |
      set -e

      cd "${{ steps.project.outputs.project_dir }}"

      chmod +x ./gradlew

      ./gradlew assembleDebug \
        --no-daemon \
        --stacktrace

  - name: Find APK
    shell: bash
    run: |
      echo "APK files found:"
      find . -type f -name "*.apk" -print

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: InteractiveHomeBot-APK
      path: "**/build/outputs/apk/**/*.apk"
      if-no-files-found: error
