name: Build Android APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4

  - name: Install Android SDK packages
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Find Android project
    id: project
    shell: bash
    run: |
      set -e

      PROJECT_FILE=$(find . -type f \
        -name "settings.gradle.kts" -o -name "settings.gradle" \
        | head -1)

      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: Android Gradle project not found."
        find . -maxdepth 8 -type f | sort | head -300
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PROJECT_FILE")

      echo "Android project found at:"
      echo "$PROJECT_DIR"

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Check Gradle Wrapper
    shell: bash
    run: |
      set -e

      cd "${{ steps.project.outputs.project_dir }}"

      echo "Project directory:"
      pwd

      echo "Project files:"
      ls -la

      if [ ! -f "./gradlew" ]; then
        echo "ERROR: gradlew was not found."
        exit 1
      fi

      chmod +x ./gradlew

      echo "Gradle wrapper found:"
      ./gradlew --version

  - name: Build Debug APK
    shell: bash
    run: |
      set -e

      cd "${{ steps.project.outputs.project_dir }}"

      chmod +x ./gradlew

      ./gradlew assembleDebug \
        --no-daemon \
        --stacktrace

  - name: Find APK
    shell: bash
    run: |
      echo "APK files found:"
      find . -type f -name "*.apk" -print

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: InteractiveHomeBot-APK
      path: "**/build/outputs/apk/**/*.apk"
      if-no-files-found: error
